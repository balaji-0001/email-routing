kind = "web"
previewPath = "/"
title = "Email Management SaaS"
description = "A responsive frontend for a team email-management platform, with a unified multi-account inbox, collaboration tools, AI and automation controls, settings, and realistic sample data. All integrations and sending actions are UI-only, ready for a future backend."
version = "1.0.0"
id = "artifacts/email-management"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24367

[services.development]
run = "pnpm --filter @workspace/email-management run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/email-management", "run", "build" ]
serve = "static"
publicDir = "artifacts/email-management/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24367"
BASE_PATH = "/"
